name: Zagster
description: Zagster was a venture-funded bike-share startup based in Boston, Massachusetts
  (a Techstars portfolio company) that designed, built, and operated bike-sharing programs
  for cities, universities, corporate campuses, hotels, and residential communities across
  the United States, peaking at more than 200 programs in 2019. The company ceased bike-share
  operations in June 2020 amid the COVID-19 pandemic and is now defunct. Its former developer
  API host (zapi.zagster.com/api/v1/bikeshares) no longer resolves, and zagster.com is now a
  parked domain, so there is no live API surface to enrich.
